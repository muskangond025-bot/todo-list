<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vishwas Interior Design</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="homepg" id="HOME">
        <div class="navbar">
            <!-- लोगो सेक्शन (सिर्फ SVG रखा है जो बेस्ट है) -->
            <div class="logo">
                <svg width="220" height="60" viewBox="0 0 250 80" xmlns="http://www.w3.org">
                    <!-- Modern V Symbol -->
                    <path d="M20 10 L40 60 L60 10" fill="none" stroke="#FFD700" stroke-width="6" stroke-linecap="round" />
                    <path d="M30 10 L50 60 L70 10" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.7" />
                    
                    <!-- Brand Name Text -->
                    <text x="85" y="45" font-family="Mulish, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">VISHWAS</text>
                    <text x="85" y="65" font-family="Mulish, sans-serif" font-size="12" letter-spacing="2" fill="#FFD700" font-weight="400">INTERIOR DESIGNER</text>
                </svg>
            </div>

            <!-- नेविगेशन आइटम्स -->
            <nav class="navbar-items h-class">
                <ul>
                    <li><a href="#HOME">HOME</a></li>
                    <li><a href="#ABOUT">ABOUT</a></li>
                    <li><a href="#SERVICES">SERVICES</a></li>
                    <li><a href="#CONTACT">CONTACT</a></li>
                    <li><a href="#BLOG">BLOG</a></li>
                </ul>
            </nav>

            <!-- मोबाइल के लिए बर्गर मेनू -->
            <div class="burger">&#9776;</div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
