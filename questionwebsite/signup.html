<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="box">
        <!-- Form ab box ke andar hai taaki animated border dikhe -->
        <form action="index.html" onsubmit="return validatePassword()">
            <div class="title">
                <h1>Create Account</h1>
            </div>
            
            <div class="input-box">
                <label for="reg-text" class="label-color">Full Name</label>
                <input id="reg-text" name="reg-text" type="text" placeholder="Enter your full name" required />

                <label for="reg-email" class="label-color">Email</label>
                <input id="reg-email" name="reg-email" type="email" placeholder="Enter your email address" required />

                <label for="reg-password" class="label-color">Password</label>
                <input id="reg-password" name="reg-password" type="password" placeholder="Create a password" required />

                <label for="confirm-password" class="label-color">Confirm Password</label>
                <input id="confirm-password" name="confirm-password" type="password" placeholder="Confirm your password" required />
                
                <input type="submit" class="Login" value="Register" />
            </div>

            <p class="link-text">Already have an account? <a href="index.html">Login Here</a></p>
        </form>
    </div>

    <!-- Password Match Check karne ke liye chota sa script -->
    <script>
        function validatePassword() {
            var pass = document.getElementById("reg-password").value;
            var confirmPass = document.getElementById("confirm-password").value;
            if (pass != confirmPass) {
                alert("Passwords do not match!");
                return false;
            }
            alert('Registration Successful! Now you can Login');
            return true;
        }
    </script>
</body>
</html>
