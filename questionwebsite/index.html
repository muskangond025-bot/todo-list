<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Form</title>
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="login.css" />
</head>

<body>
    <!-- Main container for the login form -->
    <div class="box">
            <!-- Title section -->
            <div class="title">
                <h1>Login Form</h1>
            </div>
            <!-- Input fields container -->
            <form action="home.html">

                <div class="input-box">
                    <!-- Username input -->
                    <label for="text" class="label-color">User name</label>
                    <input id="text" name="text" type="text" placeholder="Username" required />
                    <br />
                    <!-- Password input -->
                    <label for="password" class="label-color">Password</label>
                    <input id="password" name="password" type="password" placeholder="Password" required />
                    <br />
                    <!-- Login button -->
                    <input type="submit" class="Login" value="Login" />
            </form>
            <br />
            <!-- Forgot password link -->
            <p class="link-text">Forget password ? <a href="reset.html">Click Here</a></p>
            <!-- Sign up link -->
            <p class="link-text">
                Dont have an account ?
                <a href="signup.html">Click Here</a>
            </p>
    </div>
    </form>
    </div>
</body>

</html>
