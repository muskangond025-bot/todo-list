<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    nav {
      background-color: rgb(175, 221, 221);
      color: black;
      height: 60px;
      align-items: center;
      display: flex;
      justify-content: space-between;
      margin-left: auto;
    }
    ul li {
      list-style: none;
    }
    li {
      display: inline-flex;
    }
    .logo {
      color: rgb(230, 0, 76);
    }
    .timer{
        background-color: yellow;
    }
  </style>
  <body>
    <header>
      <nav>
        <h1 class="logo">Shripat Furniture</h1>
        <ul>
          <li>Home</li>
          <li>Contact Us</li>
          <li>About Us</li>
          <li>Dashboard</li>
        </ul>
      </nav>
      <div class="timer">
        timer
      </div>
    </header>
  </body>
</html>
